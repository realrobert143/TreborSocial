<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="mobile-app">
    <!-- Screen 1: Login -->
    <div id="loginScreen" class="screen form-screen active">
        <div style="text-align: center; margin-bottom: 32px;">
            <h2 style="font-size: 28px; font-weight: 700;">Sign In</h2>
            <p style="color: #868e96; margin-top: 8px;">Access secure workspace chat</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Handle / Username</label>
                <input type="text" id="loginUsername" placeholder="e.g., alex" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 12px;">Login</button>
        </form>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/app.js"></script>
</body>
</html>
